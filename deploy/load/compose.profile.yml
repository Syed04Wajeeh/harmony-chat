# Profiling overlay for the load stack (not used for the headline measurements):
#   docker compose -p harmony-load -f deploy/load/compose.load.yml -f deploy/load/compose.profile.yml \
#     --env-file deploy/load/.env up -d
# - Postgres loads pg_stat_statements so per-statement cost can be read after a run.
# - The app instances write V8 CPU profiles (.cpuprofile) to /prof when they exit.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
  app1:
    environment:
      NODE_OPTIONS: --cpu-prof --cpu-prof-dir=/prof --cpu-prof-name=app1.cpuprofile
    volumes:
      - ../../loadtest/.work/prof:/prof
  app2:
    environment:
      NODE_OPTIONS: --cpu-prof --cpu-prof-dir=/prof --cpu-prof-name=app2.cpuprofile
    volumes:
      - ../../loadtest/.work/prof:/prof
