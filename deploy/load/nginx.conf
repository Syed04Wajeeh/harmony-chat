# Main nginx config for the load stack: the image default, with enough connections per worker for
# ~10k proxied WebSockets (each uses a client-side and an upstream-side connection).
worker_processes 2;
worker_rlimit_nofile 65536;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 32768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    include /etc/nginx/conf.d/*.conf;
}
