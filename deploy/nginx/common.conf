# Shared by the user proxy and the integrations proxy (mounted into conf.d).
#
# Two identical app instances. least_conn, not round-robin, because WebSocket connections are
# long-lived: round-robin balances connection *arrivals*, which drift apart as clients come and
# go, while least_conn balances the connections that are open right now. No sticky sessions are
# needed (see NOTES.md). max_fails/fail_timeout take an instance that refuses or times out out of
# rotation for 10s after 2 failures; together with `proxy_connect_timeout` in the server blocks
# that bounds what a killed instance costs a client (nginx's default connect timeout is 60s).
#
# `resolve` (open source nginx 1.27.3+) re-resolves the hostnames through Docker's DNS every
# `valid` seconds. Without it nginx resolves them once at startup, and a recreated container
# (new IP) answers 502 until nginx is restarted. `resolve` needs a shared-memory `zone`.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream harmony_app {
    zone harmony_app 64k;
    least_conn;
    server app1:8080 resolve max_fails=2 fail_timeout=10s;
    server app2:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 64;
}

# Empty Connection keeps the upstream connection reusable for plain requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
