name: harmony

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  MODULES_DISABLED: ${MODULES_DISABLED:-}

# What the app instances need on top of that; the migrate job and the worker never get the proxy secret.
x-app-instance-env: &app-instance-env
  <<: *app-env
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET in .env}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
  ALLOWED_LOGINS: ${ALLOWED_LOGINS:-}
  OUTBOUND_PRIVATE_ALLOWLIST: ${OUTBOUND_PRIVATE_ALLOWLIST:-}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}

# Images are pinned and upgraded deliberately; opt out of host-level auto-updaters.
x-no-auto-update: &no-auto-update
  com.centurylinklabs.watchtower.enable: 'false'

# Everything the two app instances share except INSTANCE_ID.
x-app: &app
  image: harmony-app:local
  labels: *no-auto-update
  restart: unless-stopped
  volumes:
    - harmony_uploads:/data/uploads
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 512M
  networks: [harmony_internal]

services:
  postgres:
    image: postgres:16-alpine
    labels: *no-auto-update
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - harmony_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [harmony_internal]

  redis:
    image: redis:7-alpine
    labels: *no-auto-update
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [harmony_internal]

  migrate:
    build: .
    image: harmony-app:local
    labels: *no-auto-update
    command: ['node', 'apps/server/dist/migrate.js']
    restart: 'no'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [harmony_internal]

  # Two identical app instances (see NOTES.md, "Two app instances behind nginx"). They share
  # everything except INSTANCE_ID: all fan-out goes through Redis and all state is in
  # Postgres/Redis, so nginx can send any request or WebSocket to either one.
  app1:
    <<: *app
    environment:
      <<: *app-instance-env
      INSTANCE_ID: app-1

  app2:
    <<: *app
    environment:
      <<: *app-instance-env
      INSTANCE_ID: app-2

  # Delivers outgoing bot events from the transactional outbox. Same image as the app, no ports.
  worker:
    image: harmony-app:local
    labels: *no-auto-update
    restart: unless-stopped
    command: ['node', 'apps/server/dist/worker.js']
    environment:
      <<: *app-env
      INSTANCE_ID: worker-1
      OUTBOUND_PRIVATE_ALLOWLIST: ${OUTBOUND_PRIVATE_ALLOWLIST:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The worker touches this file on every loop iteration (at least every poll interval), so a
    # stuck loop stops refreshing it and the container turns unhealthy.
    healthcheck:
      test: ['CMD-SHELL', 'test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    networks: [harmony_internal]

  nginx:
    image: nginx:1.27-alpine
    labels: *no-auto-update
    restart: unless-stopped
    environment:
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET in .env}
      NGINX_ENVSUBST_FILTER: PROXY_
    volumes:
      - ./deploy/nginx/common.conf:/etc/nginx/conf.d/00-common.conf:ro
      - ./deploy/nginx/user.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '127.0.0.1:8470:8080'
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [harmony_internal]

  # Webhooks, interaction follow-ups and bot-token requests only. A separate container so the
  # proxy secret never exists anywhere other services can reach; attach it to other Docker
  # networks in docker-compose.override.yml (see docs/integrations.md).
  integrations:
    image: nginx:1.27-alpine
    labels: *no-auto-update
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/common.conf:/etc/nginx/conf.d/00-common.conf:ro
      - ./deploy/nginx/integrations.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8471:8081'
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8081/ 2>&1 | grep -q 404']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [harmony_internal]

volumes:
  harmony_pgdata:
    name: harmony_pgdata
  harmony_uploads:
    name: harmony_uploads

networks:
  harmony_internal:
    name: harmony_internal
